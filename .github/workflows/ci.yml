name: CI

# Runs on every push and every pull request. A green tick here means the tests
# passed and the code is formatted consistently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The test suite generates its own data, so nothing is downloaded here.
      - name: Run tests
        run: pytest -q --cov=brownlow --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Check formatting and style
        run: ruff check .
